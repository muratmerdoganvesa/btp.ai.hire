---
applications:
  - name: hirelens-api
    memory: 1G
    instances: 1
    timeout: 180
    docker:
      image: ghcr.io/OWNER/hirelens-api:latest
    services:
      - hana_dev
      - hirelens-xsuaa
      - hirelens-objectstore
      - hirelens-auditlog
    env:
      ASPNETCORE_ENVIRONMENT: Production

  - name: hirelens-worker
    memory: 1G
    instances: 1
    timeout: 180
    docker:
      image: ghcr.io/OWNER/hirelens-worker:latest
    services:
      - hana_dev
      - hirelens-xsuaa
      - hirelens-objectstore
      - hirelens-auditlog
    env:
      ASPNETCORE_ENVIRONMENT: Production

  - name: hirelens-web
    memory: 512M
    instances: 1
    timeout: 180
    buildpacks:
      - nodejs_buildpack
    routes:
      - route: hirelens-web.cfapps.eu20-002.hana.ondemand.com
    services:
      - hirelens-xsuaa
    env:
      destinations: '[{"name":"hirelens-api","url":"https://hirelens-api.cfapps.eu20-002.hana.ondemand.com","forwardAuthToken":true}]'
      TENANT_HOST_PATTERN: '^(?:([a-z0-9-]+)-)?hirelens-web\.cfapps\.eu20-002\.hana\.ondemand\.com$'
      XS_APP_LOG_LEVEL: info

