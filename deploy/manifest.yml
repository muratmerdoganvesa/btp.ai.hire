---
applications:
  - name: hirelens-api
    memory: 1G
    instances: 1
    timeout: 180
    docker:
      image: ghcr.io/OWNER/hirelens-api:latest
    services:
      - hana_dev
      - hirelens-xsuaa
      - hirelens-objectstore
      - hirelens-auditlog
    env:
      ASPNETCORE_ENVIRONMENT: Production
      HireLens__EnableDevAuth: "true"

  - name: hirelens-worker
    memory: 1G
    instances: 1
    timeout: 180
    docker:
      image: ghcr.io/OWNER/hirelens-worker:latest
    services:
      - hana_dev
      - hirelens-xsuaa
      - hirelens-objectstore
      - hirelens-auditlog
    env:
      ASPNETCORE_ENVIRONMENT: Production

  - name: hirelens-web
    memory: 256M
    instances: 1
    timeout: 120
    docker:
      image: ghcr.io/OWNER/hirelens-web:latest
    env:
      API_UPSTREAM: https://hirelens-api.cfapps.eu20-002.hana.ondemand.com
