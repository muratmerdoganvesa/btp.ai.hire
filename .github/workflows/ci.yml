name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build HireLens.sln -c Release
      - name: Test
        run: dotnet test HireLens.sln -c Release --no-build --filter "Category!=Integration"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: recruiter-dist
          path: frontend/apps/recruiter-console/dist

  image:
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/hirelens-api:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/hirelens-api:latest
      - name: Build and push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hirelens-worker:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/hirelens-worker:latest

  image-web:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: recruiter-dist
          path: src/HireLens.Bff/wwwroot
      - name: Confirm recruiter UI
        run: |
          test -f src/HireLens.Bff/wwwroot/index.html
          grep -q "HireLens Recruiter" src/HireLens.Bff/wwwroot/index.html
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push BFF
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.bff
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/hirelens-web:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/hirelens-web:latest

  cf-push-web:
    needs: [image-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy hirelens-web BFF
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_USER: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
          CF_DOCKER_PASSWORD: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          CF_API="$(printf '%s' "$CF_API" | tr -d '\r\n')"
          CF_USER="$(printf '%s' "$CF_USER" | tr -d '\r\n')"
          CF_PASSWORD="$(printf '%s' "$CF_PASSWORD" | tr -d '\r\n')"
          CF_ORG="$(printf '%s' "$CF_ORG" | tr -d '\r\n')"
          CF_SPACE="$(printf '%s' "$CF_SPACE" | tr -d '\r\n')"
          if [ -z "$CF_API" ] || [ -z "$CF_USER" ] || [ -z "$CF_PASSWORD" ] || [ -z "$CF_ORG" ] || [ -z "$CF_SPACE" ]; then
            echo "CF secrets are not set; hirelens-web was not deployed."
            exit 1
          fi
          curl -fsSL "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" -o cf.tgz
          tar -xzf cf.tgz
          ./cf api "$CF_API"
          ./cf auth "$CF_USER" "$CF_PASSWORD"
          ./cf target -o "$CF_ORG" -s "$CF_SPACE"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          sed "s#ghcr.io/OWNER/#ghcr.io/${OWNER}/#g" deploy/manifest.yml > /tmp/manifest.yml
          ./cf update-service hirelens-xsuaa -c deploy/xs-security.json || echo "XSUAA update skipped"
          ./cf push hirelens-web --docker-image "ghcr.io/${OWNER}/hirelens-web:${GITHUB_SHA}" --docker-username "${GITHUB_ACTOR}" -f /tmp/manifest.yml --no-start
          ./cf unset-env hirelens-web TENANT_HOST_PATTERN || true
          ./cf unset-env hirelens-web destinations || true
          ./cf unset-env hirelens-web XS_APP_LOG_LEVEL || true
          ./cf set-env hirelens-web ASPNETCORE_ENVIRONMENT Production
          ./cf set-env hirelens-web PUBLIC_HOST hirelens-web.cfapps.eu20-002.hana.ondemand.com
          ./cf map-route hirelens-web cfapps.eu20-002.hana.ondemand.com --hostname hirelens-web || true
          ./cf map-route hirelens-web cfapps.eu20-002.hana.ondemand.com --hostname dev-2z4ga5d8-hirelens-web || true
          ./cf start hirelens-web
          ./cf app hirelens-web
          if ./cf app hirelens-web | grep -Eqi 'crashed|instances:[[:space:]]*0/'; then
            echo "hirelens-web did not start"
            ./cf logs hirelens-web --recent
            exit 1
          fi


  cf-push-backend:
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy API and worker
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_USER: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
          CF_DOCKER_PASSWORD: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          CF_API="$(printf '%s' "$CF_API" | tr -d '\r\n')"
          CF_USER="$(printf '%s' "$CF_USER" | tr -d '\r\n')"
          CF_PASSWORD="$(printf '%s' "$CF_PASSWORD" | tr -d '\r\n')"
          CF_ORG="$(printf '%s' "$CF_ORG" | tr -d '\r\n')"
          CF_SPACE="$(printf '%s' "$CF_SPACE" | tr -d '\r\n')"
          if [ -z "$CF_API" ] || [ -z "$CF_USER" ] || [ -z "$CF_PASSWORD" ] || [ -z "$CF_ORG" ] || [ -z "$CF_SPACE" ]; then
            echo "CF secrets are not set; API/worker were not deployed."
            exit 1
          fi
          curl -fsSL "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" -o cf.tgz
          tar -xzf cf.tgz
          ./cf api "$CF_API"
          ./cf auth "$CF_USER" "$CF_PASSWORD"
          ./cf target -o "$CF_ORG" -s "$CF_SPACE"
          OWNER="${GITHUB_REPOSITORY_OWNER}"
          sed "s#ghcr.io/OWNER/#ghcr.io/${OWNER}/#g" deploy/manifest.yml > /tmp/manifest.yml
          ./cf push hirelens-api --docker-image "ghcr.io/${OWNER}/hirelens-api:${GITHUB_SHA}" --docker-username "${GITHUB_ACTOR}" -f /tmp/manifest.yml --no-start
          ./cf push hirelens-worker --docker-image "ghcr.io/${OWNER}/hirelens-worker:${GITHUB_SHA}" --docker-username "${GITHUB_ACTOR}" -f /tmp/manifest.yml --no-start
          ./cf set-env hirelens-api GIT_SHA "${GITHUB_SHA}"
          ./cf set-env hirelens-api ASPNETCORE_ENVIRONMENT Production
          ./cf unset-env hirelens-api HireLens__EnableDevAuth || true
          ./cf unset-env hirelens-api DOTNET_ENVIRONMENT || true
          ./cf start hirelens-api
          ./cf start hirelens-worker
          API_HOST="$(./cf app hirelens-api | awk -F': *' '/^[[:space:]]*routes:/{print $2}' | tr -d '\r' | cut -d',' -f1 | tr -d ' ')"
          if [ -n "$API_HOST" ]; then
            ./cf set-env hirelens-web API_URL "https://${API_HOST}"
            ./cf restart hirelens-web || true
          fi
          ./cf app hirelens-api

  integration:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Integration tests against bound services
        env:
          AICORE_SERVICE_KEY: ${{ secrets.AICORE_SERVICE_KEY }}
          AICORE_DEPLOYMENT_ID: ${{ secrets.AICORE_DEPLOYMENT_ID }}
          AICORE_RESOURCE_GROUP: ${{ secrets.AICORE_RESOURCE_GROUP }}
          HANA_CONNECTION: ${{ secrets.HANA_CONNECTION }}
        run: |
          if [ -z "$AICORE_SERVICE_KEY" ] || [ -z "$HANA_CONNECTION" ]; then
            echo "Live service secrets are not set; skipping integration tests."
            exit 0
          fi
          dotnet test tests/HireLens.Integration.Tests --filter "Category=Integration"
