name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  REGISTRY: ghcr.io

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Build
        run: dotnet build HireLens.sln -c Release
      - name: Test
        run: dotnet test HireLens.sln -c Release --no-build --filter "Category!=Integration"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: recruiter-dist
          path: frontend/apps/recruiter-console/dist

  image:
    needs: [backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/hirelens-api:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/hirelens-api:latest
      - name: Build and push Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.worker
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/hirelens-worker:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/hirelens-worker:latest

  image-web:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: recruiter-dist
          path: src/HireLens.Bff/wwwroot
      - name: Confirm recruiter UI
        run: |
          test -f src/HireLens.Bff/wwwroot/index.html
          grep -q "HireLens Recruiter" src/HireLens.Bff/wwwroot/index.html
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push BFF
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.bff
          push: true
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/hirelens-web:${{ github.sha }},ghcr.io/${{ github.repository_owner }}/hirelens-web:latest
      # CF Diego cells cannot use GITHUB_TOKEN to pull private GHCR images (403).
      # Public package avoids CF_DOCKER_PASSWORD / PAT package-ACL mismatches for hirelens-web.
      - name: Make hirelens-web package public for CF pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PKG=hirelens-web
          CODE=$(curl -sS -o /tmp/pkg-vis.json -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/user/packages/container/${PKG}/visibility" \
            -d '{"visibility":"public"}' || true)
          echo "visibility API HTTP ${CODE}"
          cat /tmp/pkg-vis.json || true
          if [ "${CODE}" != "204" ] && [ "${CODE}" != "200" ]; then
            echo "::warning::Could not set ${PKG} public (HTTP ${CODE}). CF pull may 403 unless GHCR_PULL_TOKEN can read this package."
          fi

  cf-push-web:
    needs: [image-web]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Deploy hirelens-web BFF
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_USER: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
          # Classic PAT (read:packages) only. Never fall back to GITHUB_TOKEN — CF cells get GHCR 403 with it,
          # and stale app-scoped docker creds keep failing even after the package is made public.
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_PULL_USERNAME || github.repository_owner }}
        run: |
          CF_API="$(printf '%s' "$CF_API" | tr -d '\r\n')"
          CF_USER="$(printf '%s' "$CF_USER" | tr -d '\r\n')"
          CF_PASSWORD="$(printf '%s' "$CF_PASSWORD" | tr -d '\r\n')"
          CF_ORG="$(printf '%s' "$CF_ORG" | tr -d '\r\n')"
          CF_SPACE="$(printf '%s' "$CF_SPACE" | tr -d '\r\n')"
          if [ -z "$CF_API" ] || [ -z "$CF_USER" ] || [ -z "$CF_PASSWORD" ] || [ -z "$CF_ORG" ] || [ -z "$CF_SPACE" ]; then
            echo "CF secrets are not set; hirelens-web was not deployed."
            exit 1
          fi
          curl -fsSL "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" -o cf.tgz
          tar -xzf cf.tgz
          ./cf api "$CF_API"
          ./cf auth "$CF_USER" "$CF_PASSWORD"
          ./cf target -o "$CF_ORG" -s "$CF_SPACE"
          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          DOCKER_USER="$(printf '%s' "${GHCR_USER}" | tr '[:upper:]' '[:lower:]' | tr -d '\r\n')"
          IMAGE="ghcr.io/${OWNER}/hirelens-web:${GITHUB_SHA}"
          sed "s#ghcr.io/OWNER/#ghcr.io/${OWNER}/#g" deploy/manifest.yml > /tmp/manifest.yml
          ./cf update-service hirelens-xsuaa -c deploy/xs-security.json || echo "XSUAA update skipped"
          # Drop app-scoped registry creds (expired GITHUB_TOKEN → GHCR 403 even on public packages).
          ./cf delete hirelens-web -f || true
          push_web() {
            if [ -n "${GHCR_PULL_TOKEN}" ]; then
              echo "Pushing ${IMAGE} with GHCR_PULL_TOKEN"
              CF_DOCKER_PASSWORD="${GHCR_PULL_TOKEN}" ./cf push hirelens-web \
                --lifecycle docker \
                --docker-image "${IMAGE}" \
                --docker-username "${DOCKER_USER}" \
                -f /tmp/manifest.yml \
                -u http \
                --endpoint /health/live \
                -t 180 \
                --no-start
            else
              echo "Pushing ${IMAGE} anonymously (public GHCR package; no docker username)"
              ./cf push hirelens-web \
                --lifecycle docker \
                --docker-image "${IMAGE}" \
                -f /tmp/manifest.yml \
                -u http \
                --endpoint /health/live \
                -t 180 \
                --no-start
            fi
          }
          push_web
          ./cf unset-env hirelens-web TENANT_HOST_PATTERN || true
          ./cf unset-env hirelens-web destinations || true
          ./cf unset-env hirelens-web XS_APP_LOG_LEVEL || true
          ./cf unset-env hirelens-web NPM_CONFIG_PRODUCTION || true
          ./cf set-env hirelens-web ASPNETCORE_ENVIRONMENT Production
          ./cf set-env hirelens-web PUBLIC_HOST hirelens-web.cfapps.eu20-002.hana.ondemand.com
          ./cf set-env hirelens-web GIT_SHA "${GITHUB_SHA}"
          ./cf set-env hirelens-web API_URL "https://hirelens-api.cfapps.eu20-002.hana.ondemand.com"
          ./cf map-route hirelens-web cfapps.eu20-002.hana.ondemand.com --hostname hirelens-web || true
          ./cf map-route hirelens-web cfapps.eu20-002.hana.ondemand.com --hostname dev-2z4ga5d8-hirelens-web || true
          ./cf start hirelens-web
          ./cf app hirelens-web
          if ./cf app hirelens-web | grep -Eqi 'crashed|instances:[[:space:]]*0/'; then
            echo "hirelens-web did not start"
            ./cf logs hirelens-web --recent
            exit 1
          fi
          sleep 15
          HEALTH="$(curl -fsS "https://hirelens-web.cfapps.eu20-002.hana.ondemand.com/health/live")"
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"role":"bff"' || {
            echo "hirelens-web is not running the BFF image"
            ./cf logs hirelens-web --recent
            exit 1
          }


  cf-push-backend:
    needs: [image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Make API/worker packages public for CF pull
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for PKG in hirelens-api hirelens-worker; do
            CODE=$(curl -sS -o /tmp/pkg-vis.json -w "%{http_code}" -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/user/packages/container/${PKG}/visibility" \
              -d '{"visibility":"public"}' || true)
            echo "${PKG} visibility API HTTP ${CODE}"
            cat /tmp/pkg-vis.json || true
          done
      - name: Deploy API and worker
        env:
          CF_API: ${{ secrets.CF_API }}
          CF_USER: ${{ secrets.CF_USERNAME }}
          CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
          CF_ORG: ${{ secrets.CF_ORG }}
          CF_SPACE: ${{ secrets.CF_SPACE }}
          # Classic PAT (read:packages) only. Never fall back to GITHUB_TOKEN — CF cells get GHCR 403 with it.
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          GHCR_USER: ${{ secrets.GHCR_PULL_USERNAME || github.repository_owner }}
          # Fallback when cf env preserve fails after app delete (binding has host only, no DB user/password).
          HANA_CONNECTION_SECRET: ${{ secrets.HANA_CONNECTION }}
          AICORE_SERVICE_KEY_SECRET: ${{ secrets.AICORE_SERVICE_KEY }}
          AICORE_DEPLOYMENT_ID_SECRET: ${{ secrets.AICORE_DEPLOYMENT_ID }}
          AICORE_RESOURCE_GROUP_SECRET: ${{ secrets.AICORE_RESOURCE_GROUP }}
        run: |
          CF_API="$(printf '%s' "$CF_API" | tr -d '\r\n')"
          CF_USER="$(printf '%s' "$CF_USER" | tr -d '\r\n')"
          CF_PASSWORD="$(printf '%s' "$CF_PASSWORD" | tr -d '\r\n')"
          CF_ORG="$(printf '%s' "$CF_ORG" | tr -d '\r\n')"
          CF_SPACE="$(printf '%s' "$CF_SPACE" | tr -d '\r\n')"
          if [ -z "$CF_API" ] || [ -z "$CF_USER" ] || [ -z "$CF_PASSWORD" ] || [ -z "$CF_ORG" ] || [ -z "$CF_SPACE" ]; then
            echo "CF secrets are not set; API/worker were not deployed."
            exit 1
          fi
          curl -fsSL "https://packages.cloudfoundry.org/stable?release=linux64-binary&version=v8&source=github" -o cf.tgz
          tar -xzf cf.tgz
          ./cf api "$CF_API"
          ./cf auth "$CF_USER" "$CF_PASSWORD"
          ./cf target -o "$CF_ORG" -s "$CF_SPACE"
          OWNER="$(printf '%s' "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          DOCKER_USER="$(printf '%s' "${GHCR_USER}" | tr '[:upper:]' '[:lower:]' | tr -d '\r\n')"
          sed "s#ghcr.io/OWNER/#ghcr.io/${OWNER}/#g" deploy/manifest.yml > /tmp/manifest.yml
          # Preserve user-provided env via v3 API. `cf env | awk` only keeps the first
          # line, which turns a pretty-printed AICORE_SERVICE_KEY into `{`.
          cf_user_env() {
            local app="$1"
            local name="$2"
            local guid
            guid="$(./cf app "${app}" --guid 2>/dev/null || true)"
            if [ -z "${guid}" ]; then
              printf '%s' ""
              return 0
            fi
            ./cf curl "/v3/apps/${guid}/environment_variables" 2>/dev/null | python3 -c 'import json,sys; d=json.loads(sys.stdin.read() or "{}"); sys.stdout.write((d.get("var") or {}).get(sys.argv[1]) or "")' "${name}" || true
          }
          aicore_json_ok() {
            python3 -c 'import json,sys; obj=json.loads(sys.stdin.read().strip()); assert isinstance(obj, dict) and obj.get("clientid") and obj.get("clientsecret"); urls=obj.get("serviceurls") or {}; assert isinstance(urls, dict) and urls.get("AI_API_URL")' 2>/dev/null
          }
          HANA_CONN="$(cf_user_env hirelens-api HANA_CONNECTION)"
          AICORE_KEY="$(cf_user_env hirelens-api AICORE_SERVICE_KEY)"
          AICORE_DEP="$(cf_user_env hirelens-api AICORE_DEPLOYMENT_ID)"
          AICORE_RG="$(cf_user_env hirelens-api AICORE_RESOURCE_GROUP)"
          AICORE_CRIT="$(cf_user_env hirelens-api AICORE_CRITERIA_DEPLOYMENT_ID)"
          if [ -z "${HANA_CONN}" ] && [ -n "${HANA_CONNECTION_SECRET}" ]; then
            echo "HANA_CONNECTION missing on app; restoring from GitHub secret."
            HANA_CONN="${HANA_CONNECTION_SECRET}"
          fi
          if ! printf '%s' "${AICORE_KEY}" | aicore_json_ok; then
            echo "AICORE_SERVICE_KEY on app is missing/invalid; using GitHub secret fallback."
            AICORE_KEY="${AICORE_SERVICE_KEY_SECRET}"
          fi
          if [ -z "${AICORE_DEP}" ] && [ -n "${AICORE_DEPLOYMENT_ID_SECRET}" ]; then
            AICORE_DEP="${AICORE_DEPLOYMENT_ID_SECRET}"
          fi
          if [ -z "${AICORE_RG}" ] && [ -n "${AICORE_RESOURCE_GROUP_SECRET}" ]; then
            AICORE_RG="${AICORE_RESOURCE_GROUP_SECRET}"
          fi
          # Drop app-scoped registry creds (expired GITHUB_TOKEN → GHCR 403 even on public packages).
          ./cf delete hirelens-api -f || true
          ./cf delete hirelens-worker -f || true
          push_backend() {
            local APP="$1"
            local IMAGE="ghcr.io/${OWNER}/${APP}:${GITHUB_SHA}"
            if [ -n "${GHCR_PULL_TOKEN}" ]; then
              echo "Pushing ${IMAGE} with GHCR_PULL_TOKEN"
              CF_DOCKER_PASSWORD="${GHCR_PULL_TOKEN}" ./cf push "${APP}" \
                --docker-image "${IMAGE}" \
                --docker-username "${DOCKER_USER}" \
                -f /tmp/manifest.yml \
                --no-start
            else
              echo "Pushing ${IMAGE} anonymously (public GHCR package; no docker username)"
              ./cf push "${APP}" \
                --docker-image "${IMAGE}" \
                -f /tmp/manifest.yml \
                --no-start
            fi
          }
          push_backend hirelens-api
          push_backend hirelens-worker
          ./cf set-env hirelens-api GIT_SHA "${GITHUB_SHA}"
          ./cf set-env hirelens-api ASPNETCORE_ENVIRONMENT Production
          ./cf set-env hirelens-worker ASPNETCORE_ENVIRONMENT Production
          if [ -n "${HANA_CONN}" ]; then
            ./cf set-env hirelens-api HANA_CONNECTION "${HANA_CONN}"
            ./cf set-env hirelens-worker HANA_CONNECTION "${HANA_CONN}"
          else
            echo "::error::HANA_CONNECTION is empty after preserve + secret fallback. Set GitHub secret HANA_CONNECTION or cf set-env before next deploy."
            exit 1
          fi
          if [ -n "${AICORE_KEY}" ]; then
            ./cf set-env hirelens-api AICORE_SERVICE_KEY "${AICORE_KEY}"
            ./cf set-env hirelens-worker AICORE_SERVICE_KEY "${AICORE_KEY}"
          fi
          if [ -n "${AICORE_DEP}" ]; then
            ./cf set-env hirelens-api AICORE_DEPLOYMENT_ID "${AICORE_DEP}"
            ./cf set-env hirelens-worker AICORE_DEPLOYMENT_ID "${AICORE_DEP}"
          fi
          if [ -n "${AICORE_CRIT}" ]; then
            ./cf set-env hirelens-api AICORE_CRITERIA_DEPLOYMENT_ID "${AICORE_CRIT}"
          else
            ./cf set-env hirelens-api AICORE_CRITERIA_DEPLOYMENT_ID "dbec6f896a57c947"
          fi
          ./cf set-env hirelens-api AICORE_CV_EXTRACTION_DEPLOYMENT_ID "d05d3551770ab22b"
          ./cf set-env hirelens-worker AICORE_CV_EXTRACTION_DEPLOYMENT_ID "d05d3551770ab22b"
          ./cf unset-env hirelens-api AICORE_MATCHING_DEPLOYMENT_ID || true
          ./cf unset-env hirelens-worker AICORE_MATCHING_DEPLOYMENT_ID || true
          ./cf set-env hirelens-api AICORE_INTERVIEW_EVALUATION_DEPLOYMENT_ID "da115516a621a2e7"
          ./cf set-env hirelens-worker AICORE_INTERVIEW_EVALUATION_DEPLOYMENT_ID "da115516a621a2e7"
          if [ -n "${AICORE_RG}" ]; then
            ./cf set-env hirelens-api AICORE_RESOURCE_GROUP "${AICORE_RG}"
            ./cf set-env hirelens-worker AICORE_RESOURCE_GROUP "${AICORE_RG}"
          fi
          ./cf unset-env hirelens-api HireLens__EnableDevAuth || true
          ./cf unset-env hirelens-api DOTNET_ENVIRONMENT || true
          ./cf start hirelens-api
          ./cf start hirelens-worker
          API_HOST="$(./cf app hirelens-api | awk -F': *' '/^[[:space:]]*routes:/{print $2}' | tr -d '\r' | cut -d',' -f1 | tr -d ' ')"
          if [ -n "$API_HOST" ]; then
            ./cf set-env hirelens-web API_URL "https://${API_HOST}"
            ./cf restart hirelens-web || true
          fi
          ./cf app hirelens-api
          if ./cf app hirelens-api | grep -Eqi 'crashed|instances:[[:space:]]*0/'; then
            echo "hirelens-api did not start"
            ./cf logs hirelens-api --recent
            exit 1
          fi

  integration:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Integration tests against bound services
        env:
          AICORE_SERVICE_KEY: ${{ secrets.AICORE_SERVICE_KEY }}
          AICORE_DEPLOYMENT_ID: ${{ secrets.AICORE_DEPLOYMENT_ID }}
          AICORE_RESOURCE_GROUP: ${{ secrets.AICORE_RESOURCE_GROUP }}
          HANA_CONNECTION: ${{ secrets.HANA_CONNECTION }}
        run: |
          if [ -z "$AICORE_SERVICE_KEY" ] || [ -z "$HANA_CONNECTION" ]; then
            echo "Live service secrets are not set; skipping integration tests."
            exit 0
          fi
          dotnet test tests/HireLens.Integration.Tests --filter "Category=Integration"
